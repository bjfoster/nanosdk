name: E2E (real-world specs)

# Generates clients for five real-world OpenAPI specs (GitHub, PokéAPI, NWS, Open-Meteo,
# APIs.guru), type-checks them strictly and calls the live APIs. Weekly, because the
# specs and APIs change underneath us; also runnable by hand.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run pytest -m e2e -v
        env:
          GITHUB_TOKEN: ${{ github.token }} # raises GitHub's API rate limit
