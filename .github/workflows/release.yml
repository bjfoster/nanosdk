name: Release

# Every push to main updates a release PR (version from the Conventional Commits since the
# last release, plus the changelog). Merging that PR creates the tag and GitHub release;
# this workflow then builds, attests, publishes to PyPI and deploys the docs.
#
# Provenance, verifiable by anyone:
#   gh attestation verify nanosdk-X.Y.Z-py3-none-any.whl --repo bjfoster/nanosdk
#   pypi-attestations verify pypi --repository https://github.com/bjfoster/nanosdk \
#       pypi:nanosdk-X.Y.Z-py3-none-any.whl
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds from the release tag with no publishing rights, and records SLSA build
  # provenance for each distribution (Sigstore-signed, stored on GitHub).
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign the provenance (Sigstore, via GitHub's OIDC token)
      attestations: write # store it on GitHub
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify the provenance just created
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishes exactly the files built and attested above. Trusted publishing (no API
  # token anywhere) also generates PEP 740 attestations, shown on PyPI as provenance.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nanosdk/
    permissions:
      id-token: write # trusted publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the distributions to the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    needs: [release-please, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
