[project]
name = "realtime-trains"
version = "0.1.0"
description = "Typed client for the Realtime Trains API (data.rtt.io), built on nanoapi"
readme = "README.md"
authors = [
    { name = "Benjamin Foster", email = "bjfoster.wrk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "nanoapi",
    "pydantic>=2.14.1",
]

[project.scripts]
rtt = "realtime_trains.__main__:main"

[project.optional-dependencies]
polars = [
    "polars>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nanoapi = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "nanoapi[codegen]",
    "polars>=2.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-pyyaml>=6.0.12.20260906",
]

# `uv run scripts/generate.py` (optionally --fetch) regenerates src/realtime_trains/_generated.
[tool.nanoapi.codegen]
spec = "spec/rtt-api.yml"
output = "src/realtime_trains/_generated"
name = "RealtimeTrainsBase"
transform = "scripts/generate.py:normalize"  # fix the upstream spec's bugs first
# Hand-written in client.py: their documented rules (exclusive parameters, the 23h59m
# window, ...) need validators; `vehicle_class` reads better than `class_`; and the token
# endpoint is used by RefreshTokenAuth. Their response models are still generated.
skip = [
    "GET /rtt/location",
    "GET /rtt/service",
    "GET /gb-nr/location",
    "GET /gb-nr/service",
    "GET /gb-nr/allocations/by-class",
    "GET /api/get_access_token",
]

[tool.nanoapi.codegen.rename]  # route names (and so response model names)
"GET /rtt/location" = "location"
"GET /rtt/service" = "service"
"GET /gb-nr/location" = "nr_location"
"GET /gb-nr/service" = "nr_service"
"GET /gb-nr/allocations/by-service" = "nr_allocations_by_service"
"GET /gb-nr/allocations/by-class" = "nr_allocations_by_class"
"GET /data/locations_ungrouped" = "locations"
"GET /data/stops" = "stops"
"GET /api/info" = "info"
"GET /api/get_access_token" = "access_token"

[tool.ruff]
extend = "../../pyproject.toml"  # nanoapi's style
extend-exclude = ["src/realtime_trains/_generated"]  # `nanoapi generate` output

[tool.ruff.lint.per-file-ignores]
# Replaces nanoapi's list: this package's own src/ must be documented too.
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["realtime_trains"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Generated models: still used for types on import, just not checked themselves. (The
# spec's allOf inheritance narrows fields in subclasses, which strict checkers flag.)
exclude = ["src/realtime_trains/_generated/models.py"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["src/realtime_trains/_generated/models.py"]
