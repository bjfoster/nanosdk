[project]
name = "realtime-trains"
version = "0.1.0"
description = "Typed client for the Realtime Trains API (data.rtt.io), built on nanoapi"
readme = "README.md"
authors = [
    { name = "Benjamin Foster", email = "bjfoster.wrk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "nanoapi",
    "pydantic>=2.14.1",
]

[project.scripts]
rtt = "realtime_trains.__main__:main"

[project.optional-dependencies]
polars = [
    "polars>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nanoapi = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.86.0",
    "polars>=2.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-pyyaml>=6.0.12.20260906",
]

# `uv run scripts/generate.py` normalizes the spec and then runs codegen with these settings.
[tool.datamodel-codegen]
input = "spec/rtt-api.normalized.json"
input-file-type = "openapi"
openapi-scopes = ["schemas", "paths"]  # responses are inline in each path, not in components
output = "src/realtime_trains/models.py"
output-model-type = "pydantic_v2.BaseModel"
output-datetime-class = "datetime"  # the API allows datetimes without a UTC offset
target-python-version = "3.13"
use-annotated = true
use-standard-collections = true
use-union-operator = true
field-constraints = true
snake-case-field = true
alias-generator = "to_camel"  # camelCase on the wire, snake_case in Python and to type checkers
allow-population-by-field-name = true
collapse-root-models = true  # `datetime | None`, not a `StandardisedDateTime` wrapper
naming-strategy = "parent-prefixed"
capitalise-enum-members = true
set-default-enum-member = true  # `= SystemStatusRttCore.OK`, not `= "OK"`
use-subclass-enum = true
use-schema-description = true
use-field-description = true
use-double-quotes = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = "# Generated by datamodel-codegen from spec/rtt-api.yml; don't edit by hand.\n# Regenerate: uv run scripts/generate.py"

[tool.ruff]
extend = "../../pyproject.toml"  # nanoapi's style
extend-exclude = ["src/realtime_trains/models.py"]  # formatted by codegen itself

[tool.ruff.lint.per-file-ignores]
# Replaces nanoapi's list: this package's own src/ must be documented too.
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["realtime_trains"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Generated: still used for types on import, just not checked itself. (The spec's allOf
# inheritance narrows fields in subclasses, which strict checkers flag.)
exclude = ["src/realtime_trains/models.py"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["src/realtime_trains/models.py"]
