[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "nanosdk[codegen]",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
extend = "../../pyproject.toml"  # same style as nanosdk itself
# Generated code (`nanosdk generate`) is formatted by the generator; don't lint or restyle it.
extend-exclude = ["packages/petstore/src/petstore/_generated"]

[tool.ruff.lint.isort]
known-first-party = ["petstore", "petstore_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]

[tool.uv.sources]
nanosdk = { path = "../..", editable = true }

[tool.pyright]
include = ["packages"]
exclude = ["packages/petstore/src/petstore/_generated/models.py"]  # datamodel-codegen output
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.13"
