[project]
name = "petstore"
version = "0.1.0"
description = "Typed Swagger Petstore SDK: datamodel-codegen models + nanoapi routes"
readme = "README.md"
authors = [
    { name = "Benjamin Foster", email = "bjfoster.wrk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "nanoapi",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nanoapi = { path = "../../../../", editable = true }

# `uv run --directory packages/petstore datamodel-codegen` regenerates models.py from this.
[tool.datamodel-codegen]
input = "openapi.json"
input-file-type = "openapi"
output = "src/petstore/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.13"
use-annotated = true
use-standard-collections = true
use-union-operator = true
field-constraints = true
snake-case-field = true
alias-generator = "to_camel"  # camelCase on the wire, snake_case in Python (and to type checkers)
allow-population-by-field-name = true
naming-strategy = "parent-prefixed"  # PetStatus / OrderStatus, not Status / Status1
capitalise-enum-members = true
use-subclass-enum = true
use-schema-description = true
use-field-description = true
use-double-quotes = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
custom-file-header = "# Generated by datamodel-codegen from openapi.json; don't edit by hand.\n# Regenerate: uv run --directory packages/petstore datamodel-codegen"
