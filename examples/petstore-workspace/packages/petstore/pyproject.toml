[project]
name = "petstore"
version = "0.1.0"
description = "Typed Swagger Petstore SDK, generated by nanoapi from its OpenAPI spec"
readme = "README.md"
authors = [
    { name = "Benjamin Foster", email = "bjfoster.wrk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "nanoapi",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nanoapi = { path = "../../../../", editable = true }

# `uv run --directory packages/petstore nanoapi generate` regenerates src/petstore/_generated
# (models via datamodel-codegen, plus parameter models, routes and clients).
[tool.nanoapi.codegen]
spec = "openapi.json"
output = "src/petstore/_generated"
name = "PetstoreBase"
base-url = "https://petstore3.swagger.io/api/v3"  # the spec only has a relative server URL
skip = ["updatePetWithForm"]  # hand-written in client.py: the server is stricter than the spec

[tool.nanoapi.codegen.rename]  # keep the SDK's established method names
getPetById = "get_pet"
findPetsByStatus = "find_by_status"
findPetsByTags = "find_by_tags"
getInventory = "inventory"
getOrderById = "get_order"
getUserByName = "get_user"
loginUser = "login"
logoutUser = "logout"
