[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoapi"
version = "0.1.0"
description = "A tiny, fully typed HTTP client core: declare routes + pydantic models, get a typed sync/async client on httpx."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]
classifiers = [
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyright", "mypy>=1.12", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/nanoapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PYI",     # typing idioms
    "PT",      # pytest style
    "PIE",
    "RET",
    "FA",      # future annotations
]

[tool.ruff.lint.isort]
known-first-party = ["nanoapi"]

[tool.pyright]
include = ["src", "tests/typecheck.py", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests/typecheck.py", "examples"]
