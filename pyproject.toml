[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoapi"
version = "0.1.0"
description = "A tiny, fully typed HTTP client core: declare routes + pydantic models, get a typed sync/async client on httpx."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]
classifiers = [
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
polars = ["polars>=1"]
pandas = ["pandas>=2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyright",
    "mypy>=1.12",
    "ruff",
    "ty>=0.0.91",
    "polars>=2.0.0",
    "pandas>=3.1.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanoapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/test_my_sdk.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PYI",     # typing idioms
    "PT",      # pytest style
    "PIE",
    "RET",
    "FA",      # future annotations
]

[tool.ruff.lint.isort]
known-first-party = ["nanoapi"]

[tool.pyright]
include = ["src", "tests/typecheck.py", "examples"]
exclude = ["examples/petstore-workspace"]  # its own uv workspace, env and checks
typeCheckingMode = "strict"
pythonVersion = "3.13"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests/typecheck.py", "examples"]
exclude = ["examples/petstore-workspace"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests/typecheck.py", "examples"]
exclude = ["^examples/petstore-workspace/"]
