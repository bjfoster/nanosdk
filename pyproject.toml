[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanosdk"
version = "0.1.0"
description = "Typed API clients on httpx + pydantic: declare routes, or generate them from OpenAPI."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Foster", email = "bjfoster.wrk@gmail.com" }]
keywords = ["api", "client", "sdk", "httpx", "pydantic", "openapi", "codegen", "typed"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bjfoster/nanosdk"
Documentation = "https://bjfoster.github.io/nanosdk/"
Repository = "https://github.com/bjfoster/nanosdk"
Issues = "https://github.com/bjfoster/nanosdk/issues"
Changelog = "https://github.com/bjfoster/nanosdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
polars = ["polars>=1"]
pandas = ["pandas>=2"]
codegen = ["datamodel-code-generator[ruff]>=0.86", "pyyaml>=6"]

[project.scripts]
nanosdk = "nanosdk.codegen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyright",
    "mypy>=1.12",
    "ruff",
    "ty>=0.0.91",
    "polars>=2.0.0",
    "pandas>=3.1.0",
    "pandas-stubs>=3.0.5.260914",
    "datamodel-code-generator[ruff]>=0.86",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "openapi-spec-validator>=0.9.0",
    "prek>=0.5.5",
]
docs = [
    "mkdocs>=1.6.1,<2",  # MkDocs 2 drops the plugin system mkdocstrings needs
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanosdk"]

[tool.hatch.build.targets.sdist]
# Library, tests and docs sources only: no examples, lockfiles or CI config.
include = [
    "/src/nanosdk", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/mkdocs.yml",
]
exclude = ["/tests/e2e/.cache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/test_my_sdk.py"]
# Real-world specs, live APIs: opt in with `uv run pytest -m e2e` (see tests/e2e).
addopts = ["-m", "not e2e"]
markers = [
    "e2e: generates clients from real-world OpenAPI specs (slow; downloads specs)",
    "network: calls live third-party APIs",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Constructor args are documented in the class docstring (rendered with the signature);
# dunder methods follow their protocol and need no docstring.
ignore = ["D105", "D107"]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PYI",     # typing idioms
    "PT",      # pytest style
    "PIE",
    "RET",
    "FA",      # future annotations
    "D",       # pydocstyle: docstrings (rendered as the API docs)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are required for the library, not for tests and examples.
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["nanosdk"]

[tool.pyright]
include = ["src", "tests/typecheck.py", "examples"]
exclude = ["examples/petstore-workspace", "examples/realtime-trains"]  # own envs and checks
typeCheckingMode = "strict"
pythonVersion = "3.13"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests/typecheck.py", "examples"]
exclude = ["examples/petstore-workspace", "examples/realtime-trains"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests/typecheck.py", "examples"]
exclude = ["^examples/(petstore-workspace|realtime-trains)/"]
